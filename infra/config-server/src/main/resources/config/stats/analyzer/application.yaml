grpc:
  server:
    port: 0

spring:
  application:
    name: analyzer
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:6543/stats
    username: user
    password: password
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.LongDeserializer
    topics:
      user-actions: stats.user-actions.v1
      event-similarity: stats.events-similarity.v1

analyzer:
  kafka:
    user-group: analyzer-user-actions-group
    similarity-group: analyzer-similarity-group
  weights:
    view: 0.4
    register: 0.8
    like: 1.0

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      enabled: true
