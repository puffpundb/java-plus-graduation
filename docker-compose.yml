services:
  stats-db:
    image: postgres:16.1
    container_name: postgres-ewm-stats-db
    ports:
      - "6543:5432"
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=user
      - POSTGRES_DB=stats
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d stats" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - ewm-network

  event-db:
    image: postgres:16.1
    container_name: postgres-event-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=user
      - POSTGRES_DB=event-service
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d event-service" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ewm-network

  comment-db:
    image: postgres:16.1
    container_name: postgres-comment-db
    ports:
      - "7654:5432"
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=user
      - POSTGRES_DB=comment-service
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d comment-service" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ewm-network

  request-db:
    image: postgres:16.1
    container_name: postgres-request-db
    ports:
      - "8765:5432"
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=user
      - POSTGRES_DB=request-service
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d request-service" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ewm-network

  user-db:
    image: postgres:16.1
    container_name: postgres-user-db
    ports:
      - "9876:5432"
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=user
      - POSTGRES_DB=user-service
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d user-service" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ewm-network

  kafka:
    image: confluentinc/confluent-local:7.4.3
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"   # for client connections
      - "9101:9101"   # JMX
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      CLUSTER_ID: 'K0EA9p0yEe6MkAAAAkKsEg'

  kafka-init-topics:
    image: confluentinc/confluent-local:7.4.3
    container_name: kafka-init-topics
    depends_on:
      - kafka
    command: >
      bash -c "
        kafka-topics --create --topic stats.user-actions.v1 \
          --partitions 1 --replication-factor 1 --if-not-exists \
          --bootstrap-server kafka:29092 && \
        kafka-topics --create --topic stats.events-similarity.v1 \
          --partitions 1 --replication-factor 1 --if-not-exists \
          --bootstrap-server kafka:29092
      "
    init: true

networks:
  ewm-network:
    driver: bridge